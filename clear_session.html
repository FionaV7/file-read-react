<!DOCTYPE html>
<html>
<head>
    <title>Clear Session</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: white;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1E293B;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        button {
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        .success {
            color: #10B981;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Session Manager</h1>
        <p>Clear all stored data and start fresh</p>
        <button onclick="clearAll()">Clear All Data</button>
        <button onclick="goToApp()">Go to App</button>
        <div id="message"></div>
    </div>

    <script>
        function clearAll() {
            localStorage.clear();
            sessionStorage.clear();
            document.getElementById('message').innerHTML = '<p class="success">✅ All data cleared! You can now login fresh.</p>';
        }

        function goToApp() {
            window.location.href = 'http://localhost:5173';
        }
    </script>
</body>
</html>
